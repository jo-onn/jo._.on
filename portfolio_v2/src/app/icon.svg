<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- jo._.on favicon: white tile, "J" (drawn as a path, no font dependency) in the site's aurora
       gradient (the deeper light-theme stops so it reads on white), and a dot in the site accent gradient. -->
  <defs>
    <linearGradient id="aurora" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e47f5a" />
      <stop offset="0.5" stop-color="#8e6fd8" />
      <stop offset="1" stop-color="#4e8ed2" />
    </linearGradient>
    <!-- Site accent gradient (indigo → blue, as on "JOURNEY" and the chips). -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c9cf5" />
      <stop offset="1" stop-color="#5b63e6" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#ffffff" />
  <path d="M38 14 V36 A9 9 0 0 1 20 36" fill="none" stroke="url(#aurora)" stroke-width="8" stroke-linecap="round" />
  <circle cx="48" cy="46" r="5" fill="url(#accent)" />
</svg>
